[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robotcord"
version = "0.1.0"
description = "Drive a Discord-hosted robot control panel (button interactions) from Python"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[tool.setuptools]
packages = ["robotcord"]
